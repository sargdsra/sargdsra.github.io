<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- متا تگ برای نمایش اعداد فارسی در مرورگر -->
  <meta http-equiv="Content-Language" content="fa">
  <meta name="language" content="Persian">
  <title>{{ page.title }} | {{ site.title }}</title>
  
  <!-- فونت صمیم از CDN -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v4.0.0/dist/font-face.css" rel="stylesheet" type="text/css" />
  
  <!-- فونت برای کدها -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap" rel="stylesheet">
  
  <!-- استایل‌های اصلی -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
  
  <!-- Highlight.js برای کدها -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
</head>
<body>
  {% include header.html %}
  
  <main class="container">
    {{ content }}
  </main>
  
  {% include footer.html %}
</body>
</html>
