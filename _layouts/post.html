---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <p>
        <strong>🕒 تاریخ:</strong> {{ page.date | persian_date: "%B %d, %Y" }}
        {% if page.author %}
          | <strong>👤 نویسنده:</strong> {{ page.author }}
        {% endif %}
      </p>
      {% if page.tags %}
        <div class="tags">
          <strong>🏷️ برچسب‌ها:</strong>
          {% for tag in page.tags %}
            <span class="tag">#{{ tag }}</span>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
